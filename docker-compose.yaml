name: mymovies-aula7

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mymovies
      POSTGRES_USER: ${POSTGRES_USER:-mymovies_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mymovies_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: my-movies:aula7
    env_file: .env.local
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mymovies
      POSTGRES_USER: ${POSTGRES_USER:-mymovies_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mymovies_pass}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
